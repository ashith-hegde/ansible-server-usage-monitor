services:

  server1:
    image: ansible-monitor-server:latest
    container_name: server1
    ports:
      - "2221:22"
    networks:
      - monitor-network

  server2:
    image: ansible-monitor-server:latest
    container_name: server2
    ports:
      - "2222:22"
    networks:
      - monitor-network

  server3:
    image: ansible-monitor-server:latest
    container_name: server3
    ports:
      - "2223:22"
    networks:
      - monitor-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

networks:
  monitor-network:
    driver: bridge
